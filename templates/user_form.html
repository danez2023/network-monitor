{# templates/user_form.html #}
{% extends "base.html" %}
{% block title %}{{ 'Edit' if user else 'Add' }} User{% endblock %}
{% block content %}
<h2><i class="bi bi-person"></i> {{ 'Edit' if user else 'Add' }} User</h2>
<hr>

<div class="row">
    <div class="col-md-6">
        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username *</label>
                <input type="text" class="form-control" id="username" name="username" required value="{{ user.username if user else '' }}">
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email *</label>
                <input type="email" class="form-control" id="email" name="email" required value="{{ user.email if user else '' }}">
            </div>
            
            <div class="mb-3">
                <label for="role" class="form-label">Role *</label>
                <select class="form-control" id="role" name="role" required>
                    <option value="user" {% if user and user.role == 'user' %}selected{% endif %}>User (View Only)</option>
                    <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Administrator</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password {{ '(leave blank to keep current)' if user else '*' }}</label>
                <input type="password" class="form-control" id="password" name="password" {{ 'required' if not user else '' }}>
            </div>
            
            <button type="submit" class="btn btn-primary">Save User</button>
            <a href="{{ url_for('users') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
